root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  bin = "../../bin/api"
  cmd = "go build -o ../../bin/api ./cmd/api"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "testdata"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = false

[log]
  time = true

[misc]
  clean_on_exit = true
